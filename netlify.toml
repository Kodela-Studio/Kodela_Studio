[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/packages"
  to = "/tjenester"
  status = 301
  force = true

[[redirects]]
  from = "/nettsider"
  to = "/tjenester/nettside"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tjenester"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tjenester/nettside"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tjenester/booking"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tjenester/oppfolging"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/om-oss"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kontakt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/personvern"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
